<script>
/* StyleReel core — deterministic timeline for 1920x1080 motion scenes.
 * Each scene calls Reel.scene({ duration, fps, setup, render(t) }).
 * Preview mode: opens in a browser, auto-plays & loops, space = pause, drag the bar to scrub.
 * Render mode (?render=1): exposes window.__seek(t) for frame-accurate capture.
 */
(function () {
  const W = 1920, H = 1080;
  const Q = new URLSearchParams(location.search);
  const RENDER = Q.has('render');
  // render scale: frames for the reel are captured at window size (1216x684 = 0.6333 of 1080p)
  const RS = RENDER ? parseFloat(Q.get('rs') || '1') : 1;

  // ---------- math ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const inv = (a, b, x) => clamp((x - a) / (b - a));
  const remap = (x, a, b, c, d, e = (k) => k) => lerp(c, d, e(inv(a, b, x)));
  const E = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuart: (t) => 1 - Math.pow(1 - t, 4),
    inQuart: (t) => t * t * t * t,
    inOutQuart: (t) => (t < 0.5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2),
    outQuint: (t) => 1 - Math.pow(1 - t, 5),
    inQuint: (t) => t ** 5,
    inOutQuint: (t) => (t < 0.5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2),
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    inOutExpo: (t) => t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
    outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
    inBack: (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t,
    outSine: (t) => Math.sin((t * Math.PI) / 2),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  };
  // damped spring from 0 -> 1, t in seconds since start (closed form, deterministic)
  function spring(t, { k = 170, c = 14, m = 1, v0 = 0 } = {}) {
    if (t <= 0) return 0;
    const w0 = Math.sqrt(k / m), z = c / (2 * Math.sqrt(k * m));
    if (z < 1) {
      const wd = w0 * Math.sqrt(1 - z * z);
      const A = 1, B = (z * w0 * A - v0) / wd;
      return 1 - Math.exp(-z * w0 * t) * (A * Math.cos(wd * t) + B * Math.sin(wd * t));
    }
    const r = -w0; // critically damped approx
    return 1 - Math.exp(r * t) * (1 + (-r - v0) * t);
  }
  // seeded RNG
  function rng(seed = 1) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const h = (a, b) => hash(a * 57 + b * 131);
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return lerp(lerp(h(ix, iy), h(ix + 1, iy), ux), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), ux), uy) * 2 - 1;
  }
  const step = (t, fps) => Math.floor(t * fps + 1e-6) / fps; // hold frames (on twos etc.)
  // window helper: progress of t inside [a, a+d]
  const win = (t, a, d, ease = E.linear) => ease(inv(a, a + d, t));

  // ---------- stage ----------
  function makeStage(bg = '#000') {
    document.documentElement.style.cssText = `margin:0;height:100%;background:${RENDER ? bg : '#0b0b0d'};overflow:hidden`;
    document.body.style.cssText = 'margin:0;height:100%;overflow:hidden';
    let stage = document.getElementById('stage');
    if (!stage) { stage = document.createElement('div'); stage.id = 'stage'; document.body.prepend(stage); }
    stage.style.cssText += `;position:absolute;left:0;top:0;width:${W}px;height:${H}px;overflow:hidden;background:${bg};transform-origin:0 0;`;
    if (RENDER && RS !== 1) stage.style.transform = `scale(${RS})`;
    // sub-pixel jitter for supersampled / motion-blurred renders (dx,dy in output pixels).
    // scenes that jitter inside their own shader set Reel.ownJitter = true and read Reel.jit instead.
    if (RENDER) window.__setJitter = (dx, dy) => {
      Reel.jit = [dx, dy];
      if (Reel.ownJitter) return;
      stage.style.transform = `translate(${dx}px, ${dy}px)` + (RS !== 1 ? ` scale(${RS})` : '');
    };
    if (!RENDER) {
      const fit = () => {
        const s = Math.min(innerWidth / W, (innerHeight - 40) / H);
        stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - 40 - H * s) / 2}px) scale(${s})`;
      };
      addEventListener('resize', fit); fit();
    }
    return stage;
  }

  // ---------- scene runner ----------
  function scene(def) {
    const fps = def.fps || 30, dur = def.duration;
    const ready = (async () => {
      const fams = def.fonts || [];
      await Promise.all(fams.map((f) => document.fonts.load(f).catch(() => {})));
      await document.fonts.ready;
      if (def.setup) await def.setup();
    })();
    window.__duration = dur; window.__fps = fps; window.__cues = def.cues || [];
    if (def.frameKey) window.__frameKey = def.frameKey;
    window.__seek = async (t) => { await ready; if (def.before) await def.before(t); def.render(t); if (def.after) await def.after(t); return true; };
    if (RENDER) return;
    // preview player
    ready.then(() => {
      const bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:40px;background:#16161a;color:#aaa;font:12px Inter,monospace;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:99;user-select:none';
      bar.innerHTML = '<span id=pp style="cursor:pointer;width:16px">❚❚</span><div id=tr style="flex:1;height:6px;background:#333;border-radius:3px;position:relative;cursor:pointer"><div id=fi style="position:absolute;left:0;top:0;bottom:0;background:#e8e8e8;border-radius:3px"></div></div><span id=tc>0.00s</span>';
      document.body.appendChild(bar);
      let t = 0, playing = true, last = performance.now();
      const pp = bar.querySelector('#pp'), tr = bar.querySelector('#tr'), fi = bar.querySelector('#fi'), tc = bar.querySelector('#tc');
      const toggle = () => { playing = !playing; pp.textContent = playing ? '❚❚' : '▶'; };
      pp.onclick = toggle; addEventListener('keydown', (e) => { if (e.code === 'Space') toggle(); });
      const scrub = (e) => { const r = tr.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width) * dur; };
      tr.onmousedown = (e) => { scrub(e); const mv = (ev) => scrub(ev); addEventListener('mousemove', mv); addEventListener('mouseup', () => removeEventListener('mousemove', mv), { once: true }); };
      const loop = (now) => {
        if (playing) { t += (now - last) / 1000; if (t > dur) t = 0; }
        last = now;
        def.render(Math.floor(t * fps) / fps);
        fi.style.width = (t / dur) * 100 + '%'; tc.textContent = t.toFixed(2) + 's';
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
  }

  // ---------- svg helpers ----------
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs = {}, parent) {
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  }
  // stroke draw-on: p in [0,1]
  function drawOn(path, p) {
    if (!path.__len) path.__len = path.getTotalLength();
    const L = path.__len;
    path.style.strokeDasharray = `${L} ${L}`;
    path.style.strokeDashoffset = `${L * (1 - clamp(p))}`;
  }
  function cfg(defaults) {
    // template text override: ?cfg={"title":"..."} (URL-encoded JSON)
    try { return Object.assign({}, defaults, JSON.parse(Q.get('cfg') || '{}')); } catch (e) { return defaults; }
  }

  // 2D canvas whose backing store follows the render scale; call begin() each frame
  function canvas2d(parent, { w = W, h = H, x = 0, y = 0, scale = 1 } = {}) {
    const cv = document.createElement('canvas');
    const k = RS * scale;
    cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    if (parent) parent.appendChild(cv);
    const ctx = cv.getContext('2d');
    const begin = () => { ctx.setTransform(k, 0, 0, k, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; };
    return { cv, ctx, begin, k };
  }

  window.Reel = { W, H, RENDER, RS, canvas2d, Q, clamp, lerp, inv, remap, E, spring, rng, hash, noise1, noise2, step, win, makeStage, scene, svgEl, drawOn, cfg, SVGNS };
})();

</script>
<script>
/* strokegl.js — 肖雄 XIAOXIONG 新风格 21 油画 / 22 粉笔 / 38 蜡笔 共用的小工具（只给这几个场景用）
   - SG.prog(gl, vs, fs)            编译着色器（报错时打印带行号源码）
   - SG.tex(gl, w, h, o)            建纹理；SG.fbo(gl, [tex...]) 建多目标帧缓冲（MRT）
   - SG.Strokes                     折线笔触 → 三角形条带顶点（每顶点 20 个 float），一次 draw 画完全部笔触
       顶点布局 a0=(x, y, s, v)  a1=(L, w, t0, t1)  a2=(rA, gA, bA, thick)  a3=(rB, gB, bB, kind)  a4=(seed, p1, p2, p3)
       s = 沿笔触的像素距离（两端各延伸 w/2 做圆头），v = 横向 -1..1（含 pad 余量），L = 笔触总长
   - SG.quad(gl)                    全屏三角形（attribute 0 = p） */
(function () {
  const SG = {};
  SG.prog = function (gl, vs, fs) {
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { const e = gl.getShaderInfoLog(s); console.error(e + '\n' + src.split('\n').map((l, i) => i + 1 + ': ' + l).join('\n')); throw new Error(e); }
      return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
    ['p', 'a0', 'a1', 'a2', 'a3', 'a4'].forEach((n, i) => gl.bindAttribLocation(pr, i, n));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { const e = gl.getProgramInfoLog(pr); console.error(e); throw new Error(e); }
    const locs = {};
    const P = {
      pr,
      use() { gl.useProgram(pr); P._unit = 0; return P; },
      loc(n) { if (!(n in locs)) locs[n] = gl.getUniformLocation(pr, n); return locs[n]; },
      f(n, ...v) { const l = P.loc(n); if (l === null) return P; [gl.uniform1f, gl.uniform2f, gl.uniform3f, gl.uniform4f][v.length - 1].call(gl, l, ...v); return P; },
      v(n, arr) { const l = P.loc(n); if (l === null) return P; const k = arr.length; (k === 2 ? gl.uniform2fv : k === 3 ? gl.uniform3fv : gl.uniform4fv).call(gl, l, arr); return P; },
      arr4(n, arr) { const l = P.loc(n); if (l !== null) gl.uniform4fv(l, arr); return P; },
      t(n, tex) { const l = P.loc(n); const u = P._unit++; gl.activeTexture(gl.TEXTURE0 + u); gl.bindTexture(gl.TEXTURE_2D, tex.tex || tex); if (l !== null) gl.uniform1i(l, u); return P; },
    };
    return P;
  };
  SG.tex = function (gl, w, h, o = {}) {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    const ifmt = o.ifmt || gl.RGBA8, fmt = o.fmt || gl.RGBA, type = o.type || gl.UNSIGNED_BYTE;
    if (o.mips) {
      const lv = Math.floor(Math.log2(Math.max(w, h))) + 1;
      gl.texStorage2D(gl.TEXTURE_2D, lv, ifmt, w, h);
    } else gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
    const f = o.filter || gl.LINEAR;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, o.mips ? gl.LINEAR_MIPMAP_LINEAR : f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, o.wrap || gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, o.wrap || gl.CLAMP_TO_EDGE);
    if (o.aniso) { const ext = gl.getExtension('EXT_texture_filter_anisotropic'); if (ext) gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, o.aniso); }
    return { tex: t, w, h, mips: !!o.mips };
  };
  SG.fbo = function (gl, texs) {
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t.tex, 0));
    gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (st !== gl.FRAMEBUFFER_COMPLETE) console.error('FBO incomplete', st.toString(16));
    return { fb, w: texs[0].w, h: texs[0].h, texs };
  };
  SG.bind = function (gl, f) { gl.bindFramebuffer(gl.FRAMEBUFFER, f ? f.fb : null); if (f) gl.viewport(0, 0, f.w, f.h); };
  // immutable (mipmapped) textures must be filled with texSubImage2D
  SG.upload = function (gl, t, src) { gl.bindTexture(gl.TEXTURE_2D, t.tex); if (t.mips) { gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, src); gl.generateMipmap(gl.TEXTURE_2D); } else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); };
  SG.quad = function (gl) {
    const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return { draw() { gl.bindVertexArray(vao); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindVertexArray(null); } };
  };
  SG.VS_QUAD = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

  // ---------- Catmull-Rom resample of a control polyline ----------
  function crSample(P, ds) {
    if (P.length === 1) P = [P[0], [P[0][0] + 0.01, P[0][1]]];
    const pts = [];
    const n = P.length;
    const g = (i) => P[Math.max(0, Math.min(n - 1, i))];
    for (let i = 0; i < n - 1; i++) {
      const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
      const segL = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
      const k = Math.max(2, Math.ceil(segL / ds));
      for (let j = 0; j < k; j++) {
        const t = j / k, t2 = t * t, t3 = t2 * t;
        const c = (a, b, c_, d) => 0.5 * (2 * b + (-a + c_) * t + (2 * a - 5 * b + 4 * c_ - d) * t2 + (-a + 3 * b - 3 * c_ + d) * t3);
        pts.push([c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    pts.push(P[n - 1].slice());
    return pts;
  }
  SG.crSample = crSample;
  function linSample(P, ds) {
    if (P.length === 1) P = [P[0], [P[0][0] + 0.01, P[0][1]]];
    const pts = [];
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1], k = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / ds));
      for (let j = 0; j < k; j++) pts.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);
    }
    pts.push(P[P.length - 1].slice());
    return pts;
  }
  SG.linSample = linSample;

  class Strokes {
    constructor() { this.d = []; this.nv = 0; this.list = []; }
    /* pts: control points [[x,y],...] (design/paint px); o: { w, t0, t1, colA:[r,g,b] 0..1, colB, thick, kind, seed, p1, p2, p3, pad, wf(u)->width factor, ds } */
    add(pts, o) {
      const ds = o.ds || Math.max(2, Math.min(10, (o.w || 10) * 0.25));
      const S = o.lin ? linSample(pts, ds) : crSample(pts, ds);
      // cumulative length
      const cl = [0];
      for (let i = 1; i < S.length; i++) cl.push(cl[i - 1] + Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]));
      const L = Math.max(cl[cl.length - 1], 0.01);
      const w = o.w || 10, pad = o.pad ?? 0.25;
      // tangents
      const T = S.map((p, i) => {
        const a = S[Math.max(0, i - 1)], b = S[Math.min(S.length - 1, i + 1)];
        const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l];
      });
      // extend both ends by w/2 for round caps
      const ext = w * 0.5 * (o.cap ?? 1);
      const rows = [];
      const t0 = T[0], tn = T[T.length - 1];
      rows.push([S[0][0] - t0[0] * ext, S[0][1] - t0[1] * ext, -ext, t0]);
      for (let i = 0; i < S.length; i++) rows.push([S[i][0], S[i][1], cl[i], T[i]]);
      rows.push([S[S.length - 1][0] + tn[0] * ext, S[S.length - 1][1] + tn[1] * ext, L + ext, tn]);
      const cA = o.colA || [1, 1, 1], cB = o.colB || cA;
      const per = [L, w, o.t0 ?? 0, o.t1 ?? 0.001, cA[0], cA[1], cA[2], o.thick ?? 1, cB[0], cB[1], cB[2], o.kind ?? 0, o.seed ?? ((this.list.length * 7.31 + 1.7) % 97), o.p1 ?? 0, o.p2 ?? 0, o.p3 ?? 0];
      const vmax = 1 + pad;
      const vert = (r, side) => {
        const u = Math.max(0, Math.min(1, r[2] / L));
        const wf = o.wf ? o.wf(u) : 1;
        const hw = w * 0.5 * wf * vmax;
        const nx = -r[3][1], ny = r[3][0];
        this.d.push(r[0] + nx * hw * side, r[1] + ny * hw * side, r[2], side * vmax, ...per);
        this.nv++;
      };
      for (let i = 0; i < rows.length - 1; i++) {
        const a = rows[i], b = rows[i + 1];
        vert(a, -1); vert(a, 1); vert(b, 1);
        vert(a, -1); vert(b, 1); vert(b, -1);
      }
      this.list.push({ pts, o, L });
      return L;
    }
    upload(gl) {
      const arr = new Float32Array(this.d);
      this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
      const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
      for (let k = 0; k < 5; k++) { gl.enableVertexAttribArray(k + 1); gl.vertexAttribPointer(k + 1, 4, gl.FLOAT, false, 80, k * 16); }
      gl.bindVertexArray(null);
      this.gl = gl; this.count = this.nv;
      return this;
    }
    reset() { this.d = []; this.nv = 0; this.list = []; return this; }
    // re-upload every frame (geometry that changes, e.g. a stop-motion redraw)
    uploadDynamic(gl) {
      if (!this.vao) {
        this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
        this.buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
        for (let k = 0; k < 5; k++) { gl.enableVertexAttribArray(k + 1); gl.vertexAttribPointer(k + 1, 4, gl.FLOAT, false, 80, k * 16); }
        gl.bindVertexArray(null);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.d), gl.DYNAMIC_DRAW);
      this.gl = gl; this.count = this.nv;
      return this;
    }
    draw(first = 0, count = this.count) { const gl = this.gl; gl.bindVertexArray(this.vao); gl.drawArrays(gl.TRIANGLES, first, count); gl.bindVertexArray(null); }
  }
  SG.Strokes = Strokes;

  // vertex shader for strokes: paint-space px -> clip; PS = paint size, VIEW = (ox, oy, scale) optional
  SG.VS_STROKE = `#version 300 es
in vec4 a0; in vec4 a1; in vec4 a2; in vec4 a3; in vec4 a4;
uniform vec2 PS; uniform vec3 VIEW;
out vec4 v0; flat out vec4 v1; flat out vec4 v2; flat out vec4 v3; flat out vec4 v4;
void main(){
  v0 = a0; v1 = a1; v2 = a2; v3 = a3; v4 = a4;
  vec2 q = (a0.xy - VIEW.xy) * VIEW.z;
  gl_Position = vec4(q.x/PS.x*2.-1., 1.-q.y/PS.y*2., 0., 1.);
}`;
  // GLSL noise helpers shared by the scenes
  SG.GLSL_NOISE = `
float hash11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
float vn1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(hash11(i), hash11(i+1.), f); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vn(p); p=mat2(1.6,1.2,-1.2,1.6)*p+3.1; a*=.5; } return s; }
float fbm3(vec2 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*vn(p); p=mat2(1.6,1.2,-1.2,1.6)*p+3.1; a*=.5; } return s; }
`;
  window.SG = SG;
})();

<script>
// 连续运动轨道：镜头、灯光、任何随时间变化的一组数值都可以用。
// 问题：每段各自 ease-in-out，镜头每到一个关键帧就减速到零，看起来“走走停停”。
// 做法：关键帧之间用三次 Hermite 曲线，经过关键帧时速度连续不归零；只有首尾（或标了 stop 的关键帧）才停。
//   const cam = Track([
//     { t: 0,   v: [0, 1.2, 8] },
//     { t: 2,   v: [1, 1.0, 6] },
//     { t: 4,   v: [0, 0.4, 3], stop: true },   // stop: 这一帧真的要停住（撞击、定格）
//     { t: 5.5, v: [0, 2.0, 9] },
//   ], { easeIn: true, easeOut: true });        // 默认首尾缓入缓出；false = 首尾也带速度进出
//   const [x, y, z] = cam(t);                    // t 超出范围时停在首 / 尾
//   cam.vel(t) → 每秒速度（用来做跟随、晃动强度、运动模糊参考）
// 角度（如 yaw）跨 ±π 时请先展开成连续数值再放进来。
(function (g) {
  function Track(keys, o = {}) {
    const n = keys.length, dim = keys[0].v.length, zero = () => new Array(dim).fill(0);
    const sl = (i, j) => keys[i].v.map((x, d) => (keys[j].v[d] - x) / (keys[j].t - keys[i].t));
    const m = keys.map((k, i) => {
      if (n === 1) return zero();
      if (i === 0) return o.easeIn === false ? sl(0, 1) : zero();
      if (i === n - 1) return o.easeOut === false ? sl(n - 2, n - 1) : zero();
      if (k.stop) return zero();
      const a = sl(i - 1, i), b = sl(i, i + 1), d0 = k.t - keys[i - 1].t, d1 = keys[i + 1].t - k.t;
      // 两侧斜率按时长加权；方向相反（来回运动的拐点）时取 0，避免冲过头
      return a.map((_, d) => (a[d] * b[d] <= 0 ? 0 : (a[d] * d1 + b[d] * d0) / (d0 + d1)));
    });
    function seg(t) {
      if (t <= keys[0].t) return [0, 0];
      if (t >= keys[n - 1].t) return [n - 2, 1];
      let i = 0; while (keys[i + 1].t < t) i++;
      return [i, (t - keys[i].t) / (keys[i + 1].t - keys[i].t)];
    }
    function at(t) {
      if (n === 1) return keys[0].v.slice();
      const [i, u] = seg(t), h = keys[i + 1].t - keys[i].t, u2 = u * u, u3 = u2 * u;
      const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
      return keys[i].v.map((p0, d) => h00 * p0 + h10 * h * m[i][d] + h01 * keys[i + 1].v[d] + h11 * h * m[i + 1][d]);
    }
    at.vel = (t) => { const e = 1 / 240, a = at(t - e), b = at(t + e); return a.map((x, d) => (b[d] - x) / (2 * e)); };
    at.keys = keys;
    return at;
  }
  // 整段只做一次缓动的写法：路径匀速，时间整体 ease（适合一条完整的推拉 / 环绕）
  Track.ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
  Track.easeRange = (t, t0, t1) => Track.ease((t - t0) / (t1 - t0));
  g.Track = Track;
  if (typeof module !== 'undefined') module.exports = Track;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ---------- 小孩的字：一个字一个位置、一个角度 ---------- */
function textStrokes(str, cx, cy, size, t0, t1) {
  const W2 = 1280, H2 = 360;
  const c = document.createElement('canvas');
  c.width = W2; c.height = H2;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#000'; g.fillRect(0, 0, W2, H2);
  g.fillStyle = '#fff';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const chars = Array.from(str);
  const adv = size * 1.02;
  const total = adv * chars.length;
  chars.forEach((ch, i) => {
    const jx = (hsh(i * 3.7, 1) - 0.5) * size * 0.10;
    const jy = (hsh(i * 5.1, 2) - 0.5) * size * 0.16;
    const rot = (hsh(i * 7.3, 3) - 0.5) * 0.16;
    const sc = 0.9 + hsh(i * 2.9, 4) * 0.2;
    g.save();
    g.translate(W2 / 2 - total / 2 + adv * (i + 0.5) + jx, H2 / 2 + jy);
    g.rotate(rot);
    g.scale(sc, sc);
    g.font = `700 ${size}px "KaiTi", "楷体", "STKaiti", "Noto Sans CJK SC", sans-serif`;
    g.fillText(ch, 0, 0);
    g.restore();
  });

  const d = g.getImageData(0, 0, W2, H2).data;
  const on = (x, y) => (x >= 0 && y >= 0 && x < W2 && y < H2) && d[(y * W2 + x) * 4] > 128;

  const segs = [];
  const interp = (x1, y1, v1, x2, y2, v2) => { const t = v1 / (v1 - v2); return [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]; };
  for (let y = 0; y < H2 - 1; y += 2) {
    for (let x = 0; x < W2 - 1; x += 2) {
      const a = on(x, y) ? 1 : 0, b = on(x + 2, y) ? 1 : 0, cc = on(x + 2, y + 2) ? 1 : 0, dd = on(x, y + 2) ? 1 : 0;
      const idx = a | (b << 1) | (cc << 2) | (dd << 3);
      if (idx === 0 || idx === 15) continue;
      const top = interp(x, y, a, x + 2, y, b), right = interp(x + 2, y, b, x + 2, y + 2, cc);
      const bottom = interp(x, y + 2, dd, x + 2, y + 2, cc), left = interp(x, y, a, x, y + 2, dd);
      const L = {
        1: [[left, top]], 2: [[top, right]], 3: [[left, right]], 4: [[right, bottom]],
        5: [[left, top], [right, bottom]], 6: [[top, bottom]], 7: [[left, bottom]],
        8: [[bottom, left]], 9: [[bottom, top]], 10: [[top, right], [bottom, left]],
        11: [[bottom, right]], 12: [[right, left]], 13: [[right, top]], 14: [[top, left]], 15: [],
      }[idx];
      for (const [p1, p2] of L) segs.push([p1, p2]);
    }
  }

  const key = (q) => Math.round(q[0] / 3) + ',' + Math.round(q[1] / 3);
  const map = new Map();
  segs.forEach((sg, i) => { for (const q of sg) { const k = key(q); if (!map.has(k)) map.set(k, []); map.get(k).push(i); } });
  const used = new Uint8Array(segs.length);
  const polys = [];
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    used[i] = 1;
    const poly = [segs[i][0], segs[i][1]];
    let guard = 0;
    while (guard++ < 5000) {
      const tail = poly[poly.length - 1];
      const cands = (map.get(key(tail)) || []).filter((j) => !used[j]);
      if (!cands.length) break;
      const j = cands[0];
      used[j] = 1;
      const [q1, q2] = segs[j];
      poly.push(key(q1) === key(tail) ? q2 : q1);
      if (key(poly[poly.length - 1]) === key(poly[0])) break;
    }
    if (poly.length > 6) polys.push(poly);
  }

  polys.sort((A, B) => (A[0][0] - B[0][0]) || (A[0][1] - B[0][1]));
  polys.forEach((poly, i) => {
    const tt = t0 + (i / Math.max(1, polys.length)) * (t1 - t0);
    const pts = poly.map(([x, y]) => [cx - W2 / 2 + x, cy - H2 / 2 + y]);
    const w = 8 + hsh(i * 1.7, 9) * 3;
    crayon(ST, wob(pts, 5.5, 60 + i * 3.1), COL.red, tt, tt + 0.18, { w, p2: 0.9, noTool: true });
    TIPS.push([tt + 0.16, pts[0][0], pts[0][1], 2]);
  });
}

/* ---------- 我们的画：星夜底下的兔子和猫 ---------- */
function drawing() {

  /* 天空：满涂，但要有秩序 —— 一个主漩涡 + 大片安静的深蓝 + 少量亮笔 */
  const SKY = { x0: 185, y0: 62, x1: 1718, y1: 744 };
  const SKYP = [[SKY.x0, SKY.y0], [SKY.x1, SKY.y0], [SKY.x1, SKY.y1], [SKY.x0, SKY.y1]];
  const S_D1 = hex('#122a63'), S_D2 = hex('#1b3a7d'), S_MID = hex('#2c53a8'), S_LT = hex('#5f8bd0');
  const S_CRM = hex('#f0dfa6'), S_WHT = hex('#fdf8e4');

  /* 1) 打底：两遍密涂，先把纸盖住（这一层不讲笔触，只讲覆盖） */
  crayon(ST, scribble(SKYP, 0.10, 7, 10, 21), S_D1, 0.0, 0.45, { w: 44, p2: 1.0 });
  crayon(ST, scribble(SKYP, 0.85, 8, 10, 23), S_D2, 0.35, 0.8, { w: 40, p2: 1.0 });

  /* 2) 主漩涡：只有一个，位置偏左，作为整片天的“眼” */
  const S = { x: 690, y: 320, R: 250 };
  const dirAt = (x, y) => {
    const dx = x - S.x, dy = y - S.y, d2 = dx * dx + dy * dy;
    const w = 1 / (1 + d2 / (S.R * S.R));
    let vx = -dy * w * 0.06 + 0.28 * (1 - w);
    let vy = dx * w * 0.06 + 0.05 * (1 - w);
    const L = Math.hypot(vx, vy) || 1;
    return [vx / L, vy / L];
  };

  /* 3) 笔触：宽、长、疏；颜色只在深蓝—中蓝之间，亮色留给漩涡臂和星月 */
  for (let y = SKY.y0 + 22; y < SKY.y1; y += 42) {
    for (let x = SKY.x0 + 22; x < SKY.x1; x += 42) {
      const jx = x + (hsh(x * 0.7 + y * 1.3, 1) - 0.5) * 20;
      const jy = y + (hsh(x * 1.1 + y * 0.9, 2) - 0.5) * 20;
      const [dx, dy] = dirAt(jx, jy);
      const len = 86 + hsh(jx, jy) * 46;
      const ox = jx - dx * len * 0.5, oy = jy - dy * len * 0.5;
      const n = hsh(jx * 0.23, jy * 0.61);
      const dSwirl = Math.hypot(jx - S.x, jy - S.y) / S.R;
      let col = n > 0.55 ? S_MID : S_D2;
      if (dSwirl < 0.55 && n > 0.72) col = S_LT;
      const t = 0.8 + ((jx - SKY.x0) / (SKY.x1 - SKY.x0)) * 1.6;
      crayon(ST, wob([[ox, oy], [ox + dx * len, oy + dy * len]], 4, 300 + jx * 0.11), col, t, t + 0.06, { w: 34, p2: 0.99 });
    }
  }

  /* 4) 漩涡臂上一道奶油色的亮：只此一道，不撒满 */
  const armPts = [];
  for (let i = 0; i <= 60; i++) {
    const u = i / 60, ang = -2.3 + u * Math.PI * 1.9, r = 40 + u * S.R * 0.92;
    armPts.push([S.x + Math.cos(ang) * r, S.y + Math.sin(ang) * r * 0.72]);
  }
  crayon(ST, wob(armPts, 6, 401), S_CRM, 2.45, 2.85, { w: 30, p2: 0.98 });
  const arm2 = armPts.map(([x, y]) => [x * 0.998 + 6, y + 10]);
  crayon(ST, wob(arm2, 7, 403), S_MID, 2.7, 3.0, { w: 20, p2: 0.95 });

  /* 5) 星星：只留五颗，小而干净 */
  for (let k = 0; k < 5; k++) {
    const sx = 360 + hsh(k, 41) * 1180, sy = 130 + hsh(k, 42) * 380, rr = 11 + hsh(k, 43) * 8;
    crayon(ST, wob(circ(sx, sy, rr + 7, (rr + 7) * 0.95, 0, 6.6, 14), 3, 1000 + k), S_CRM, 3.0 + k * 0.04, 3.12 + k * 0.04, { w: 9, noTool: true });
    crayon(ST, wob(circ(sx, sy, rr * 0.5, rr * 0.5, 0, 6.6, 10), 2, 1010 + k), S_WHT, 3.1 + k * 0.04, 3.16 + k * 0.04, { w: 9, noTool: true });
  }

  /* 6) 月亮：从外到内 淡蓝→奶油→黄→橙，一圈圈收进去，最后是厚月牙 */
  const crescent = (cx, cy, R, a0, a1, n = 48) => Array.from({ length: n + 1 }, (_, i) => {
    const t = lerp(a0, a1, i / n);
    return [cx + Math.cos(t) * R, cy + Math.sin(t) * R * 0.94];
  });
  const MX = 1458, MY = 216;
  const RINGS = [
    [122, 14, '#8aa6d8'], [110, 14, '#c9d3e8'], [98, 15, '#efe3b6'],
    [86, 15, '#f6d98a'], [74, 16, '#f7c65a'],
  ];
  RINGS.forEach(([rr, ww, col], k) => {
    crayon(ST, wob(circ(MX, MY, rr, rr * 0.96, 0, 6.6, 52), 5, 700 + k), hex(col), 2.95 + k * 0.07, 3.08 + k * 0.07, { w: ww, p2: 0.95 });
  });
  /* 月牙：外缘深橙，内缘亮黄，开口朝左下 */
  crayon(ST, wob(crescent(MX, MY, 54, -2.75, 0.45), 2.5, 720), hex('#c97a16'), 3.4, 3.62, { w: 46, p2: 0.99 });
  crayon(ST, wob(crescent(MX, MY, 50, -2.55, 0.3), 2.2, 722), hex('#e9a52c'), 3.55, 3.72, { w: 30, p2: 0.97 });
  crayon(ST, wob(crescent(MX, MY, 46, -2.35, 0.2), 2, 724), hex('#f8d67a'), 3.68, 3.8, { w: 15, p2: 0.95 });
  TIPS.push([3.4, MX - 28, MY + 18, 0]);

  /* 6b) 远山：把天和地接起来 */
  const hills = [
    [[185, 716], [520, 664], [860, 706], [1180, 660], [1520, 700], [1718, 676], [1718, 756], [185, 756]],
    [[185, 742], [600, 706], [1020, 738], [1400, 700], [1718, 730], [1718, 772], [185, 772]],
  ];
  hills.forEach((poly, k) => {
    crayon(ST, wob([...poly, poly[0]], 7, 1300 + k), k ? hex('#16224e') : hex('#1d2c5e'), 3.45 + k * 0.08, 3.7 + k * 0.08, { w: 26, p2: 0.98 });
    crayon(ST, scribble(poly, 0.1, 14, 6, 1310 + k), k ? hex('#111b41') : hex('#17224f'), 3.6 + k * 0.08, 3.95 + k * 0.08, { w: 26, p2: 0.97 });
  });
  /* 山坡上的小窗 */
  for (let k = 0; k < 4; k++) {
    const wx = 620 + k * 240 + hsh(k, 51) * 60, wy = 726 + hsh(k, 52) * 18;
    crayon(ST, [[wx, wy], [wx, wy - 9], [wx + 9, wy - 9], [wx + 9, wy]], hex('#ffd27a'), 3.95 + k * 0.03, 4.0 + k * 0.03, { w: 7, noTool: true });
  }

  /* 7) 顶边：打散成短笔，不要硬横条 */
  for (let k = 0; k < 22; k++) {
    const x0 = SKY.x0 + hsh(k, 61) * 1450;
    const w = 90 + hsh(k, 62) * 190;
    const y = SKY.y0 + 4 + hsh(k, 63) * 34;
    crayon(ST, wob([[x0, y + 6], [x0 + w, y - 3]], 6, 1400 + k), hex('#0d1b45'), 3.5 + k * 0.01, 3.7 + k * 0.01, { w: 26, p2: 0.95 });
  }

  /* 地面 */

  } else {
    LIT = 2; SMOKE_AT = T;
    HINT.textContent = '再 点 一 下 · 重 新 点 燃';
  }
  HINT.style.opacity = '1';
});

let LOOP_ON = true;
function loop(now) {
  if (LOOP_ON) requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - LAST) / 1000); LAST = now;
  if (T < INTRO) {
    T = Math.min(INTRO, (now - START) / 1000);
    if (T >= INTRO) { HINT.textContent = '轻 触 蛋 糕'; HINT.style.opacity = '1'; }
  }
  drawScene(T);
}
window.__dbg = () => ({ T: +T.toFixed(2), LIT, playing, w: cv.width, h: cv.height, rect: cv.getBoundingClientRect().toJSON() });

/* ROTATE_HINT：竖屏时提示横过来 */
const RH = document.createElement('div');
RH.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9;'
  + 'font:600 13px/1.6 "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.2em;'
  + 'color:rgba(255,244,220,.92);background:rgba(20,16,12,.55);padding:8px 14px;border-radius:20px;'
  + 'pointer-events:none;transition:opacity .5s';
RH.textContent = '↻ 横过来看更清楚';
document.body.appendChild(RH);
function checkOrient() {
  const portrait = innerHeight > innerWidth * 1.05;
  RH.style.opacity = portrait ? '1' : '0';
}
addEventListener('resize', checkOrient); checkOrient();
requestAnimationFrame(loop);
</script></body></html>
